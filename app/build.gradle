plugins { id 'com.android.application' }
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.mayeh.materials'
    compileSdk 35
    buildToolsVersion '35.0.0'
    signingConfigs {
        debug {
            storeFile file("${rootDir}/.signing/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.mayeh.materials'
        minSdk 26
        targetSdk 35
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
