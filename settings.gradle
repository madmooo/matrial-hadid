pluginManagement {
    repositories {
        maven { url 'https://redirector.gvt1.com/edgedl/android/maven2/'; content { includeGroupByRegex 'com\\.android.*'; includeGroupByRegex 'androidx\\..*'; includeGroupByRegex 'com\\.google\\.testing.*' } }
        mavenCentral()
    }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'com.android.application') useModule("com.android.tools.build:gradle:${requested.version}") } }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://redirector.gvt1.com/edgedl/android/maven2/'; content { includeGroupByRegex 'com\\.android.*'; includeGroupByRegex 'androidx\\..*'; includeGroupByRegex 'com\\.google\\.testing.*' } }
        mavenCentral()
    }
}
rootProject.name = 'Mayeh'
include ':app'
